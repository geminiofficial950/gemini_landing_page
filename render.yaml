# One-click deploy on Render: New → Blueprint → pick this repo.
# Secrets marked sync:false are entered in the Render dashboard, never committed.
services:
  - type: web
    name: gemini-landing-page
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: MAIL_FROM_NAME
        value: Gemini Education
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MONGO_URI
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_NOTIFY_EMAIL
        sync: false
